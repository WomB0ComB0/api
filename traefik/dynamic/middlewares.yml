http:
  middlewares:
    # CORS aligned with mikeodnis.dev properties and cdn.mikeodnis.dev
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowOriginList:
          - https://mikeodnis.dev
          - https://www.mikeodnis.dev
          - https://cdn.mikeodnis.dev
          - https://blog.mikeodnis.dev
          - https://news.mikeodnis.dev
          - https://links.mikeodnis.dev
        accessControlAllowHeaders:
          - Accept
          - Authorization
          - Content-Type
          - X-API-Key
          - X-Request-ID
        accessControlExposeHeaders:
          - Content-Length
          - X-Request-ID
          - RateLimit-Limit
          - RateLimit-Remaining
          - RateLimit-Reset
          - RateLimit-Policy
          - Retry-After
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
          - X-RateLimit-Reset
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
        addVaryHeader: true

    # Security Headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        forceSTSHeader: true
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    # Compression
    compress:
      compress:
        minResponseBodyBytes: 1024

    # Rate limiting (tiered edge ceilings)
    global-ratelimit:
      rateLimit:
        average: 1000
        burst: 500
        period: 1m

    auth-ratelimit:
      rateLimit:
        average: 30
        burst: 15
        period: 1m

    write-ratelimit:
      rateLimit:
        average: 120
        burst: 40
        period: 1m
