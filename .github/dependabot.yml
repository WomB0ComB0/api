version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/services/core"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      core-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/media"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      media-go-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/services/core"
      - "/services/media"
      - "/services/health"
      - "/services/gateway"
      - "/hasura"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
