name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-core:
    name: Bun Audit (core-service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install & audit dependencies
        working-directory: ./services/core
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high

  audit-media:
    name: Go Vulnerability Check (media-service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: services/media/go.sum

      - name: Run govulncheck
        working-directory: ./services/media
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  audit-workflows:
    name: GitHub Actions Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          strict-collection: true
          advanced-security: false
          annotations: true

  secret-scan:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure no .env or private key files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "::error::Sensitive file committed to git!"
            exit 1
          fi
          echo "No committed .env or key files found."

  notify-heartbeat:
    name: Better Stack Heartbeat
    needs: [audit-core, audit-media, audit-workflows, secret-scan]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Better Stack security audit heartbeat
        env:
          HEARTBEAT_URL: ${{ secrets.BETTERSTACK_SECURITY_HEARTBEAT_URL }}
          AUDIT_CORE: ${{ needs.audit-core.result }}
          AUDIT_MEDIA: ${{ needs.audit-media.result }}
          AUDIT_WORKFLOWS: ${{ needs.audit-workflows.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "BETTERSTACK_SECURITY_HEARTBEAT_URL secret not set; skipping heartbeat ping."
            exit 0
          fi
          if [ "$AUDIT_CORE" = "success" ] && [ "$AUDIT_MEDIA" = "success" ] && [ "$AUDIT_WORKFLOWS" = "success" ] && [ "$SECRET_SCAN" = "success" ]; then
            curl -fsS --max-time 10 "${HEARTBEAT_URL%/}" > /dev/null
            echo "Success heartbeat reported to Better Stack."
          else
            curl -fsS --max-time 10 "${HEARTBEAT_URL%/}/fail" > /dev/null || true
            echo "Failure heartbeat reported to Better Stack."
            exit 1
          fi
