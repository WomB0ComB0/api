name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Force build & deploy all services'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      media: ${{ steps.filter.outputs.media }}
      health: ${{ steps.filter.outputs.health }}
      gateway: ${{ steps.filter.outputs.gateway }}
      hasura: ${{ steps.filter.outputs.hasura }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            core:
              - 'services/core/**'
              - '.github/workflows/ci-cd.yml'
            media:
              - 'services/media/**'
              - '.github/workflows/ci-cd.yml'
            health:
              - 'services/health/**'
              - '.github/workflows/ci-cd.yml'
            gateway:
              - 'services/gateway/**'
              - '.github/workflows/ci-cd.yml'
            hasura:
              - 'hasura/**'
              - '.github/workflows/ci-cd.yml'
            infra:
              - 'docker-compose*.yml'
              - 'database/**'
              - 'traefik/**'
              - 'otel-collector-config.yaml'
              - '.env.example'
              - '.github/workflows/ci-cd.yml'

  test-core:
    name: Test Core (Bun + Elysia)
    needs: changes
    if: always() && (needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: services/core
        run: bun install --frozen-lockfile

      - name: Typecheck, test, compile binary & export OpenAPI
        working-directory: services/core
        run: |
          bun run typecheck
          bun test
          bun run build
          bun run export-openapi dist/openapi.json

      - name: Upload Core OpenAPI spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-openapi
          path: services/core/dist/openapi.json
          retention-days: 14

  test-media:
    name: Test Media (Go Hexagonal)
    needs: changes
    if: always() && (needs.changes.outputs.media == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: services/media/go.sum

      - name: Vet, staticcheck, race-test (incl. Hexagonal & N+1 tests), and build
        working-directory: services/media
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go test -race -coverprofile=coverage.out ./...
          go build -trimpath -ldflags="-s -w" ./cmd/server

  test-health:
    name: Test Health Aggregator (Python)
    needs: changes
    if: always() && (needs.changes.outputs.health == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Strict static typecheck (mypy + pyright) & unit tests
        working-directory: services/health
        run: |
          python -m pip install --quiet mypy pyright
          mypy --config-file pyproject.toml main.py test_main.py
          pyright main.py test_main.py
          python -m unittest discover -v

  validate-infra:
    name: Validate Compose, Caddy & Hasura Config
    needs: changes
    if: always() && (needs.changes.outputs.infra == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.hasura == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose (dev + prod)
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Validate Caddyfile syntax
        run: |
          docker run --rm -v "${{ github.workspace }}/services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile

  test-gateway:
    name: Test Gateway (built image, served routes & headers)
    needs: changes
    if: always() && (needs.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Builds services/gateway/Dockerfile, runs it with every upstream pointed at a closed local
      # port, and checks what it serves with services/gateway/tests/gateway.test.ts.
      - name: Build the gateway image and test what it serves
        run: services/gateway/tests/run.sh

  build-images:
    name: Build & Push (${{ matrix.service }})
    needs: [changes, test-core, test-media, test-health, validate-infra, test-gateway]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            context: ./services/core
            changed_key: core
          - service: media
            context: ./services/media
            changed_key: media
          - service: health
            context: ./services/health
            changed_key: health
          - service: gateway
            context: ./services/gateway
            changed_key: gateway
          - service: hasura
            context: ./hasura
            changed_key: hasura
    steps:
      - name: Check if service changed
        id: should_build
        env:
          CHANGED: ${{ needs.changes.outputs[matrix.changed_key] }}
          FORCE: ${{ inputs.deploy_all }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.should_build.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.should_build.outputs.run == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.should_build.outputs.run == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        if: steps.should_build.outputs.run == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push image (cached)
        if: steps.should_build.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-railway:
    name: Deploy Changed Services to Railway
    needs: [changes, build-images]
    # build-images is skipped, not failed, when a test job fails, so require its success here or a
    # failing test would still let `railway up` deploy the service from source.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.build-images.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://api.mikeodnis.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Deploy changed services via Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          FORCE_ALL: ${{ inputs.deploy_all }}
          CHG_CORE: ${{ needs.changes.outputs.core }}
          CHG_MEDIA: ${{ needs.changes.outputs.media }}
          CHG_HEALTH: ${{ needs.changes.outputs.health }}
          CHG_GATEWAY: ${{ needs.changes.outputs.gateway }}
          CHG_HASURA: ${{ needs.changes.outputs.hasura }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::Skipping Railway deploy (set RAILWAY_TOKEN project token secret to enable auto-deploy)."
            exit 0
          fi

          deploy_if_needed() {
            local dir="$1" svc="$2" chg="$3"
            if [ "$chg" = "true" ] || [ "$FORCE_ALL" = "true" ]; then
              echo "Deploying $svc from $dir..."
              bunx @railway/cli@5.75.0 up "$dir" --service "$svc" --environment production --path-as-root --detach --yes
            fi
          }

          deploy_if_needed "services/core" "core-service" "$CHG_CORE"
          deploy_if_needed "services/media" "media-service" "$CHG_MEDIA"
          deploy_if_needed "services/health" "health-aggregator" "$CHG_HEALTH"
          deploy_if_needed "services/gateway" "gateway" "$CHG_GATEWAY"
          deploy_if_needed "hasura" "hasura" "$CHG_HASURA"

  live-smoke-test:
    name: Post-Deploy Live Verification
    needs: [deploy-railway]
    if: |
      success() &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live endpoints & security headers
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            for attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 10 "$url" >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "Failed health check: $url"
            return 1
          }

          check_url "https://api.mikeodnis.dev/health"
          check_url "https://api.mikeodnis.dev/v1/core/health"
          check_url "https://api.mikeodnis.dev/v1/core/openapi.json"
          check_url "https://api.mikeodnis.dev/v1/media/health/ready"

          HEADERS=$(curl -sS -D - -o /dev/null https://api.mikeodnis.dev/health)
          echo "$HEADERS" | grep -qi "strict-transport-security:"
          echo "$HEADERS" | grep -qi "x-content-type-options: nosniff"
          echo "$HEADERS" | grep -qi "x-frame-options: DENY"

          {
            echo "### Production Live Verification (\`api.mikeodnis.dev\`)"
            echo "- \`/health\`: 200 OK"
            echo "- \`/v1/core/health\` & \`/v1/core/openapi.json\`: 200 OK"
            echo "- \`/v1/media/health/ready\`: 200 OK (Postgres + R2)"
            echo "- Security headers verified: \`HSTS\`, \`X-Content-Type-Options: nosniff\`, \`X-Frame-Options: DENY\`"
          } >> "$GITHUB_STEP_SUMMARY"
