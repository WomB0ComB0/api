- name: default
  kind: postgres
  configuration:
    connection_info:
      use_prepared_statements: false
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
  tables:
    - "!include core_users.yaml"
    - "!include links_links.yaml"
    - "!include links_clicks.yaml"
